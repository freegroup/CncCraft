[package]
name = "cnccraft"
version = "0.1.0"
edition = "2021"
description = "Ein CNC-Entwurfs- und Fräsprogramm (Nachbau der Kernfunktionen von Vectric Spark)"

[[bin]]
name = "cnccraft"
path = "src/main.rs"

[workspace]
members = [".", "crates/shape-edit"]

[dependencies]
shape-edit = { path = "crates/shape-edit" }
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29.1"
epaint_default_fonts = "0.29.1"
ttf-parser = "0.25"
geo = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
