[package]
name = "cnccraft"
version = "1.29.0"
edition = "2021"
description = "Ein CNC-Entwurfs- und Fräsprogramm (Nachbau der Kernfunktionen von Vectric Spark)"
homepage = "https://freegroup.github.io/CncCraft/"
repository = "https://github.com/freegroup/CncCraft"

[[bin]]
name = "cnccraft"
path = "src/main.rs"

[workspace]
members = [".", "crates/shape-edit"]

[dependencies]
shape-edit = { path = "crates/shape-edit" }
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29.1"
epaint_default_fonts = "0.29.1"
ttf-parser = "0.25"
geo = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust-i18n = "3"
sys-locale = "0.3"
# update check: pure-Rust HTTPS (rustls), no system OpenSSL and no external program
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
openh264 = "0.9"
mp4 = "0.14"
bytes = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
