# Release per Semantic Versioning aus den Commit-Messages (Conventional Commits) – ohne PR.
#
# Ablauf: Push auf main → semantic-release wertet die Commits seit dem letzten Tag aus,
# bestimmt die neue Version, bumpt Cargo.toml + Cargo.lock, pflegt CHANGELOG.md, erstellt
# Tag und GitHub-Release direkt. Danach bauen `linux` und `windows` die Pakete und hängen
# sie an die Release.
#
# Version-Regeln:  fix: → Patch (0.1.1) · feat: → Minor (0.2.0) · feat!:/BREAKING CHANGE → Major (1.0.0)
# Commits ohne passenden Typ (docs:, chore:, ci:, refactor: …) lösen kein Release aus.
#
# macOS (.dmg/.zip) wird lokal auf einem Mac gebaut und mit ./build_and_release.sh an die
# erzeugte Release gehängt – dafür gibt es keinen passenden GitHub-Runner.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.sr.outputs.new_release_published }}
      tag: ${{ steps.sr.outputs.new_release_git_tag }}
      version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Regel: Änderungen an .rs-Dateien sollen immer mindestens ein Release erzeugen.
      # Fehlt seit dem letzten Tag ein feat:/fix:-Commit, wird automatisch ein leerer
      # fix:-Commit angelegt – semantic-release macht daraus einen Patch (statt abzubrechen).
      # Ausnahme: Hat der aktuelle Commit einen Conventional-Commit-Prefix der explizit
      # kein Release auslöst (docs:, chore:, ci: usw.), wird kein Auto-fix erzeugt.
      - name: "Code-Änderungen ohne feat:/fix: automatisch als fix: freigeben"
        run: |
          current_msg=$(git log -1 --format='%s')
          if echo "$current_msg" | grep -qE '^(docs|chore|ci|style|test|refactor|build|revert)(\([^)]+\))?!?:'; then
            echo "Auto-fix übersprungen: '${current_msg}' soll kein Release auslösen."
            exit 0
          fi
          base=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n1)
          echo "Basis seit letztem Release: $base"
          if git diff --name-only "$base"..HEAD | grep -qE '\.rs$' \
             && ! git log "$base"..HEAD --format='%s' | grep -qE '^(feat|fix)(\([^)]+\))?!?:'; then
            git config user.name "semantic-release-bot"
            git config user.email "semantic-release-bot@martynus.net"
            git commit --allow-empty -m "fix: Code-Änderungen ohne feat:/fix: automatisch als Patch freigegeben"
            echo "Leeren fix:-Commit erzeugt – es wird ein Patch-Release ausgelöst."
          else
            echo "Kein Auto-fix nötig (keine .rs-Änderung oder bereits feat:/fix: vorhanden)."
          fi
      # git notes werden von actions/checkout nicht mitgefetcht; ohne Fetch würde
      # semantic-release beim Schreiben neuer Notes einen leeren lokalen Stand sehen
      # und ggf. einen ungültigen Push-Delta erzeugen.
      - name: Fetch git notes
        run: git fetch origin 'refs/notes/*:refs/notes/*' || true
      - uses: cycjimmy/semantic-release-action@v4
        id: sr
        # Notes-Push schlägt manchmal fehl (GitHub lehnt refs/notes/* ab), obwohl
        # Tag, Commit und GitHub-Release bereits erfolgreich erstellt wurden.
        # continue-on-error verhindert, dass dieser Nebenfehler den gesamten Job
        # und damit die linux/windows-Build-Jobs blockiert.
        continue-on-error: true
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prüfen ob Release fehlgeschlagen
        if: steps.sr.outcome == 'failure'
        run: |
          published="${{ steps.sr.outputs.new_release_published }}"
          if [ "$published" != "true" ]; then
            echo "::error::semantic-release ist fehlgeschlagen und kein Release wurde veröffentlicht."
            exit 1
          fi
          echo "Hinweis: Notes-Push fehlgeschlagen, aber Release v${{ steps.sr.outputs.new_release_version }} wurde erfolgreich veröffentlicht."

  linux:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Bibliotheken für Fenster und OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxkbcommon-dev libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev
      - run: ./build.sh linux
      - name: Pakete an die Release hängen
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/*.tar.gz dist/*.deb --clobber

  windows:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Inno Setup für den Installer
        run: choco install innosetup -y
      - run: |
          export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          ./build.sh windows
      - name: Pakete an die Release hängen
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/*-setup.exe --clobber
